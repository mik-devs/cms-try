user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 64M;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Map for WebSocket Upgrade header handling
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ✅ ITO YUNG NAWALA KANINA: Map para sa X-Forwarded-Proto
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    server {
        listen __PORT__;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK";
        }

        # -------------------------------------------------------------
        # Laravel Reverb WebSockets & Pusher Protocol Endpoints
        # -------------------------------------------------------------
        location ~ ^/(app|apps)(/|$) {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;

            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

            proxy_set_header Host $http_host;
            proxy_set_header Scheme $scheme;
            proxy_set_header SERVER_PORT $server_port;
            proxy_set_header REMOTE_ADDR $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # ✅ CRITICAL FIX: Literal "Upgrade" para sa WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_redirect off;
        }

        # -------------------------------------------------------------
        # Standard HTTP Traffic -> Laravel php artisan serve
        # -------------------------------------------------------------
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;

            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

            proxy_set_header Host $http_host;
            proxy_set_header Scheme $scheme;
            proxy_set_header SERVER_PORT $server_port;
            proxy_set_header REMOTE_ADDR $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }
    }
}