[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisor/nginx.log
stderr_logfile_maxbytes=0

[program:laravel-web]
command=php /app/artisan serve --host=127.0.0.1 --port=8000
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/laravel-web.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisor/laravel-web.log
stderr_logfile_maxbytes=0

[program:laravel-reverb]
command=php /app/artisan reverb:start --host=0.0.0.0 --port=8080 --no-tls
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/laravel-reverb.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisor/laravel-reverb.log
stderr_logfile_maxbytes=0